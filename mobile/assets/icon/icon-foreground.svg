<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Foreground layer for Android adaptive icon. Kept inside the 66% central
    safe zone (roughly 340 → 684 on this 1024 canvas) so any launcher mask
    (circle, squircle, teardrop) still shows the mark intact.

    Design language matches the app: a cream face silhouette wrapped by a
    partial mauve "analysis" arc — same visual as the Scorecard ring and
    Analyzing screen.
  -->

  <!-- Face silhouette (cream) -->
  <path d="M512 288
           C 612 288, 680 380, 680 500
           C 680 626, 612 720, 512 720
           C 412 720, 344 626, 344 500
           C 344 380, 412 288, 512 288 Z"
        fill="#E8DCC4"/>

  <!-- Analysis arc (mauve, 270° open at bottom-right) -->
  <path d="M 512 232
           A 268 268 0 1 1 322.5 690.5"
        fill="none"
        stroke="#B0648D"
        stroke-width="38"
        stroke-linecap="round"/>

  <!-- Scan sweep highlight -->
  <line x1="360" y1="512" x2="664" y2="512"
        stroke="#F2EDE4" stroke-width="4" opacity="0.75" stroke-linecap="round"/>
</svg>
